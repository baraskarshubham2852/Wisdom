<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    :root {
      font-family: "Segoe UI", sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 400px);
      padding: 32px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 24px;
      font-size: 28px;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 44px;
      margin-bottom: 18px;
      padding: 0 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font: inherit;
    }

    input:focus {
      border-color: #2563eb;
      outline: 3px solid rgba(37, 99, 235, 0.15);
    }

    button {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .status {
      min-height: 20px;
      margin: 16px 0 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>Login</h1>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6">

      <button type="submit">Sign in</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();
      document.getElementById("status").textContent = "Login form submitted.";
    });
  </script>
</body>
</html>
